<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCar - Veículos</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div id="app" v-cloak class="d-flex flex-column min-vh-100">
  <app-header></app-header>

  <main class="container py-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Veículos</h1>
      <button v-if="modo === 'lista'" class="btn btn-primary" @click="novo">
        <i class="bi bi-plus-lg"></i> Cadastrar
      </button>
    </div>

    <div v-if="erro" class="alert alert-danger">{{ erro }}</div>
    <div v-if="sucesso" class="alert alert-success">{{ sucesso }}</div>

    <!-- Lista -->
    <div v-if="modo === 'lista'" class="table-responsive">
      <table class="table table-striped table-hover bg-white border">
        <thead class="table-light">
          <tr>
            <th>Descrição</th>
            <th>Placa</th>
            <th>Disponível</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="veiculo in veiculos" :key="veiculo.id">
            <td>{{ veiculo.descricao }}</td>
            <td class="text-nowrap">{{ veiculo.placa }}</td>
            <td>{{ fmt.simNao(veiculo.disponivel) }}</td>
            <td class="text-end text-nowrap">
              <button class="btn btn-sm btn-outline-primary me-1" @click="editar(veiculo)" title="Editar">
                <i class="bi bi-pencil"></i><span class="d-none d-md-inline"> Editar</span>
              </button>
              <button class="btn btn-sm btn-outline-danger" @click="excluir(veiculo)" title="Excluir">
                <i class="bi bi-trash"></i><span class="d-none d-md-inline"> Excluir</span>
              </button>
            </td>
          </tr>
          <tr v-if="veiculos.length === 0">
            <td colspan="4" class="text-center text-secondary">Nenhum veículo cadastrado.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Formulário (cadastro e edição) -->
    <form v-else class="card card-body" @submit.prevent="salvar">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="descricao">Descrição</label>
          <input id="descricao" class="form-control" v-model.trim="form.descricao" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="disponivel">Disponível</label>
          <input id="disponivel" class="form-control" :value="fmt.simNao(form.disponivel)" disabled>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="placa">Placa</label>
          <input id="placa" class="form-control" :class="{ 'is-invalid': placaEmUso }" v-model.trim="form.placa"
                 :disabled="!!form.id" @input="placaEmUso = false" @blur="verificarPlaca" required>
          <div class="invalid-feedback">Já existe um veículo com esta placa.</div>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-outline-secondary" @click="voltar">Voltar</button>
        <button type="submit" class="btn btn-primary" :disabled="placaEmUso">Salvar</button>
      </div>
    </form>
  </main>

  <app-footer></app-footer>
</div>

<script src="vendor/vue.global.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  criarApp({
    perfis: ['FUNCIONARIO'],
    data() {
      return {
        veiculos: [],
        modo: 'lista', // 'lista' ou 'form'
        form: {},
        placaEmUso: false,
        erro: '',
        sucesso: '',
      };
    },
    mounted() {
      this.carregar();
    },
    methods: {
      async carregar() {
        try {
          this.veiculos = await api.get('/veiculos');
        } catch (e) {
          this.erro = e.message;
        }
      },
      limparMensagens() {
        this.erro = '';
        this.sucesso = '';
      },
      novo() {
        this.limparMensagens();
        this.form = { id: null, descricao: '', placa: '', disponivel: true };
        this.placaEmUso = false;
        this.modo = 'form';
      },
      editar(veiculo) {
        this.limparMensagens();
        this.form = { ...veiculo };
        this.placaEmUso = false;
        this.modo = 'form';
      },
      voltar() {
        this.limparMensagens();
        this.modo = 'lista';
      },
      async verificarPlaca() {
        if (this.form.id || !this.form.placa) return;
        try {
          this.placaEmUso = await api.get('/veiculos/existe?placa=' + encodeURIComponent(this.form.placa));
        } catch (e) {
          this.erro = e.message;
        }
      },
      async salvar() {
        this.limparMensagens();
        try {
          if (this.form.id) {
            // Na edição só a descrição pode ser alterada
            await api.patch(`/veiculos/${this.form.id}`, { descricao: this.form.descricao });
            this.sucesso = 'Veículo alterado com sucesso.';
          } else {
            await api.post('/veiculos', { placa: this.form.placa, descricao: this.form.descricao });
            this.sucesso = 'Veículo cadastrado com sucesso.';
          }
          this.modo = 'lista';
          await this.carregar();
        } catch (e) {
          this.erro = e.message;
        }
      },
      async excluir(veiculo) {
        if (!confirm(`Excluir o veículo ${veiculo.placa}?`)) return;
        this.limparMensagens();
        try {
          await api.delete(`/veiculos/${veiculo.id}`);
          this.sucesso = 'Veículo excluído com sucesso.';
          await this.carregar();
        } catch (e) {
          this.erro = e.message;
        }
      },
    },
  }).mount('#app');
</script>
</body>
</html>
