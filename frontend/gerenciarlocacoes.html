<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCar - Gerenciar Locações</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div id="app" v-cloak class="d-flex flex-column min-vh-100">
  <app-header></app-header>

  <main class="container py-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Gerenciar Locações</h1>
      <button v-if="modo === 'lista'" class="btn btn-primary" @click="nova">
        <i class="bi bi-plus-lg"></i> Nova locação
      </button>
    </div>

    <div v-if="erro" class="alert alert-danger">{{ erro }}</div>
    <div v-if="sucesso" class="alert alert-success">{{ sucesso }}</div>

    <!-- Lista -->
    <div v-if="modo === 'lista'" class="table-responsive">
      <table class="table table-striped table-hover bg-white border">
        <thead class="table-light">
          <tr>
            <th>Cliente</th>
            <th>Veículo</th>
            <th>Situação</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="locacao in locacoes" :key="locacao.id">
            <td>{{ nomeCliente(locacao.clienteId) }}</td>
            <td class="text-nowrap">{{ placaVeiculo(locacao.veiculoId) }}</td>
            <td>
              <span class="badge" :class="locacao.situacao === 'EM_ANDAMENTO' ? 'text-bg-warning' : 'text-bg-secondary'">
                {{ fmt.situacao(locacao.situacao) }}
              </span>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary" @click="gerenciar(locacao)">Gerenciar</button>
            </td>
          </tr>
          <tr v-if="locacoes.length === 0">
            <td colspan="4" class="text-center text-secondary">Nenhuma locação cadastrada.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Formulário: nova locação ou gerenciar uma existente -->
    <form v-else class="card card-body" @submit.prevent="salvar">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="veiculo">Veículo</label>
          <select id="veiculo" class="form-select" v-model="form.veiculoId" :disabled="!!form.id" required>
            <option value="" disabled>Selecione um veículo</option>
            <option v-for="veiculo in opcoesVeiculo" :key="veiculo.id" :value="veiculo.id">
              {{ veiculo.descricao }} - {{ veiculo.placa }}
            </option>
          </select>
          <div v-if="!form.id && opcoesVeiculo.length === 0" class="form-text text-danger">
            Nenhum veículo disponível no momento.
          </div>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="cliente">Cliente</label>
          <select id="cliente" class="form-select" v-model="form.clienteId" :disabled="!!form.id" required>
            <option value="" disabled>Selecione um cliente</option>
            <option v-for="cliente in clientes" :key="cliente.id" :value="cliente.id">{{ cliente.login }}</option>
          </select>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="situacao">Situação</label>
          <input id="situacao" class="form-control" :value="fmt.situacao(form.situacao)" disabled>
        </div>
      </div>
      <div class="d-flex flex-wrap justify-content-between gap-2 mt-4">
        <button v-if="form.id && form.situacao === 'EM_ANDAMENTO'" type="button" class="btn btn-warning" @click="finalizar">
          <i class="bi bi-flag"></i> Finalizar
        </button>
        <span v-else></span>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary" @click="voltar">Voltar</button>
          <button v-if="!form.id" type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </form>
  </main>

  <app-footer></app-footer>
</div>

<script src="vendor/vue.global.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  criarApp({
    perfis: ['FUNCIONARIO'],
    data() {
      return {
        locacoes: [],
        veiculos: [],
        clientes: [],
        modo: 'lista', // 'lista' ou 'form'
        form: {},
        erro: '',
        sucesso: '',
      };
    },
    computed: {
      // Na criação só aparecem veículos disponíveis; ao gerenciar, mostra o veículo da locação
      opcoesVeiculo() {
        return this.form.id ? this.veiculos : this.veiculos.filter((v) => v.disponivel);
      },
    },
    mounted() {
      this.carregar();
    },
    methods: {
      async carregar() {
        try {
          [this.locacoes, this.veiculos, this.clientes] = await Promise.all([
            api.get('/locacoes/minhas'),
            api.get('/veiculos'),
            api.get('/usuarios/clientes'),
          ]);
        } catch (e) {
          this.erro = e.message;
        }
      },
      // A API devolve só os ids; aqui buscamos placa/login nas listas carregadas
      placaVeiculo(id) {
        const veiculo = this.veiculos.find((v) => v.id === id);
        return veiculo ? veiculo.placa : `#${id}`;
      },
      nomeCliente(id) {
        const cliente = this.clientes.find((c) => c.id === id);
        return cliente ? cliente.login : `#${id}`;
      },
      limparMensagens() {
        this.erro = '';
        this.sucesso = '';
      },
      nova() {
        this.limparMensagens();
        this.form = { id: null, veiculoId: '', clienteId: '', situacao: 'EM_ANDAMENTO' };
        this.modo = 'form';
      },
      gerenciar(locacao) {
        this.limparMensagens();
        this.form = { ...locacao };
        this.modo = 'form';
      },
      voltar() {
        this.limparMensagens();
        this.modo = 'lista';
      },
      async salvar() {
        this.limparMensagens();
        try {
          await api.post('/locacoes', { veiculoId: this.form.veiculoId, clienteId: this.form.clienteId });
          this.sucesso = 'Locação cadastrada com sucesso.';
          this.modo = 'lista';
          await this.carregar();
        } catch (e) {
          this.erro = e.message;
        }
      },
      async finalizar() {
        if (!confirm('Finalizar esta locação?')) return;
        this.limparMensagens();
        try {
          await api.patch(`/locacoes/${this.form.id}/finalizar`);
          this.sucesso = 'Locação finalizada com sucesso.';
          this.modo = 'lista';
          await this.carregar();
        } catch (e) {
          this.erro = e.message;
        }
      },
    },
  }).mount('#app');
</script>
</body>
</html>
