<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCar - Minhas Locações</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div id="app" v-cloak class="d-flex flex-column min-vh-100">
  <app-header></app-header>

  <main class="container py-4 flex-grow-1">
    <h1 class="h4 mb-3">Minhas Locações</h1>

    <div v-if="erro" class="alert alert-danger">{{ erro }}</div>

    <div class="table-responsive">
      <table class="table table-striped bg-white border">
        <thead class="table-light">
          <tr>
            <th>Veículo</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="locacao in locacoes" :key="locacao.id">
            <td>
              <span class="text-nowrap">{{ veiculos[locacao.veiculoId]?.placa }}</span>
              <small class="text-secondary ms-2">{{ veiculos[locacao.veiculoId]?.descricao }}</small>
            </td>
            <td>
              <span class="badge" :class="locacao.situacao === 'EM_ANDAMENTO' ? 'text-bg-warning' : 'text-bg-secondary'">
                {{ fmt.situacao(locacao.situacao) }}
              </span>
            </td>
          </tr>
          <tr v-if="locacoes.length === 0">
            <td colspan="2" class="text-center text-secondary">Você ainda não possui locações.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <app-footer></app-footer>
</div>

<script src="vendor/vue.global.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  criarApp({
    perfis: ['CLIENTE'],
    data() {
      return {
        locacoes: [],
        veiculos: {}, // { id: veiculo }
        erro: '',
      };
    },
    async mounted() {
      try {
        this.locacoes = await api.get('/locacoes/minhas');
        // A locação só traz o veiculoId; o cliente pode consultar GET /veiculos/{id} para obter a placa
        const ids = [...new Set(this.locacoes.map((l) => l.veiculoId))];
        const veiculos = await Promise.all(ids.map((id) => api.get(`/veiculos/${id}`)));
        this.veiculos = Object.fromEntries(veiculos.map((v) => [v.id, v]));
      } catch (e) {
        this.erro = e.message;
      }
    },
  }).mount('#app');
</script>
</body>
</html>
