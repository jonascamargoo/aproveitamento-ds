<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCar - Login</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div id="app" v-cloak class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="card shadow-sm w-100" style="max-width: 400px">
    <div class="card-body p-4">
      <div class="text-center mb-4 logo">
        <i class="bi bi-car-front-fill display-4"></i>
        <h1 class="h2 fw-bold mb-0">OCar</h1>
        <small class="text-uppercase text-secondary">Dirija sua história</small>
      </div>

      <div v-if="sucesso" class="alert alert-success">{{ sucesso }}</div>
      <div v-if="erro" class="alert alert-danger">{{ erro }}</div>

      <form @submit.prevent="entrar">
        <div class="mb-3">
          <label class="form-label" for="login">Login</label>
          <input id="login" class="form-control" v-model.trim="login" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="senha">Senha</label>
          <input id="senha" type="password" class="form-control" v-model="senha" required>
        </div>
        <div class="d-flex gap-2">
          <a href="usuario.html" class="btn btn-outline-secondary flex-fill">Cadastrar</a>
          <button type="submit" class="btn btn-primary flex-fill" :disabled="carregando">Login</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="vendor/vue.global.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  criarApp({
    data() {
      const params = new URLSearchParams(window.location.search);
      return {
        login: params.get('login') || '',
        senha: '',
        erro: '',
        sucesso: params.has('cadastrado') ? 'Usuário cadastrado com sucesso! Faça o login.' : '',
        carregando: false,
      };
    },
    methods: {
      async entrar() {
        this.erro = '';
        this.sucesso = '';
        this.carregando = true;
        try {
          const resposta = await api.post('/login', { login: this.login, senha: this.senha });
          auth.salvarToken(resposta.token);
          window.location.href = 'menu.html';
        } catch (e) {
          this.erro = e.message;
        } finally {
          this.carregando = false;
        }
      },
    },
  }).mount('#app');
</script>
</body>
</html>
